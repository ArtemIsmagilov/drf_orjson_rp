[project]
name = "drf-orjson-rp"
version = "0.3.0"
description = "DRF renderer and parser based on orjson"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
keywords = ["drf", "orjson", "parser", "renderer"]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Framework :: Django",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Programming Language :: Python :: Implementation :: CPython",
  "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = ["djangorestframework>=3.15.2", "orjson>=3.11.7"]

[project.urls]
Repository = "https://github.com/ArtemIsmagilov/drf_orjson_rp.git"

[dependency-groups]
dev = ["basedpyright", "coverage", "prek", "ruff"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.basedpyright]
typeCheckingMode = "standard"

[tool.ruff]
line-length = 79

[tool.ruff.lint]
extend-select = [
  "E",  # pycodestyle
  "W",  # pycodestyle warnings
  "F",  # Pyflakes
  "UP",  # pyupgrade
  "B",  # flake8-bugbear
  "SIM",  # flake8-simplify
  "I",  # isort
  "C4",  # flake8-comprehensions
]

[tool.ruff.format]
docstring-code-format = true
